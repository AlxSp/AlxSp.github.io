  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1090" role="img" aria-labelledby="nag-title nag-desc">
    <style>
      :root { --background:#fff; --foreground:#050505; --viz-series-1:#81ABDB; --viz-series-2:#E89E63; --viz-series-3:#77B17C; --viz-series-4:#C883A8; }
      .sans { font-family:Arial, Helvetica, sans-serif; fill:var(--foreground); }
      .math { font-family:"Times New Roman", Times, serif; font-style:italic; fill:var(--foreground); }
      .blue-text { fill:var(--viz-series-1); } .teal-text { fill:var(--viz-series-2); } .purple-text { fill:var(--viz-series-4); }
      .arrow { stroke:var(--foreground);stroke-width:3.1;fill:none;marker-end:url(#nag-arrow); }
      .blue-stroke { stroke:var(--viz-series-1); } .teal-stroke { stroke:var(--viz-series-2); }
      .gold-stroke { stroke:var(--viz-series-3); } .purple-stroke { stroke:var(--viz-series-4); }
    </style>
    <title id="nag-title">NAG Modulator</title>
    <desc id="nag-desc">The normalized residual R bar sub l is down-projected by learned weights and biases into C activations and passed through a sigmoid. Learned logits named coef pass through softmax to form weights p sub l. The two C-vectors are multiplied elementwise, summed, and raised to a learned positive beta sub l.</desc>

    <defs>
      <marker id="nag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--foreground)"/>
      </marker>
    </defs>

    <rect x="0" y="0" width="1460" height="1090" fill="#fff"/>

    <text x="730" y="84" class="sans" font-size="59" font-weight="700" text-anchor="middle">NAG Modulator</text>

    <!-- Legend -->
    <g transform="translate(1140 137)" class="sans" font-size="19">
      <rect x="0" y="0" width="24" height="28" fill="var(--viz-series-1)" fill-opacity=".16" class="blue-stroke" stroke-width="1.5"/>
      <text x="46" y="21">input / computed quantities</text>
      <rect x="0" y="45" width="24" height="28" fill="var(--viz-series-2)" fill-opacity=".16" class="teal-stroke" stroke-width="1.7" stroke-dasharray="8 5" rx="2"/>
      <text x="46" y="66">learned parameters</text>
      <rect x="0" y="90" width="24" height="28" fill="var(--viz-series-3)" fill-opacity=".16" class="gold-stroke" stroke-width="1.4"/>
      <text x="46" y="111">operations</text>
      <rect x="0" y="135" width="24" height="28" fill="var(--viz-series-4)" fill-opacity=".18" class="purple-stroke" stroke-width="1.5"/>
      <text x="46" y="156">output (scalar)</text>
    </g>

    <!-- Top branch labels -->
    <g class="sans" font-size="24" text-anchor="middle">
      <text x="108" y="222" font-weight="600">Orthogonalized /</text>
      <text x="108" y="252" font-weight="600">normalized</text>
      <text x="108" y="282" font-weight="600">layer output</text>
    </g>
    <text x="188" y="285" class="math" font-size="34">R̄<tspan baseline-shift="sub" font-size="20">l</tspan></text>

    <text x="350" y="338" class="math teal-text" font-size="35" font-weight="700" text-anchor="middle">W<tspan baseline-shift="sub" font-size="20">l</tspan><tspan baseline-shift="super" font-size="20">⊤</tspan>, b<tspan baseline-shift="sub" font-size="20">l</tspan></text>
    <text x="571" y="329" class="math" font-size="29" text-anchor="middle">z<tspan baseline-shift="sub" font-size="17">l</tspan> = W<tspan baseline-shift="sub" font-size="17">l</tspan><tspan baseline-shift="super" font-size="17">⊤</tspan> R̄<tspan baseline-shift="sub" font-size="17">l</tspan> + b<tspan baseline-shift="sub" font-size="17">l</tspan></text>
    <text x="878" y="329" class="math" font-size="35" text-anchor="middle">a<tspan baseline-shift="sub" font-size="19">l</tspan> = σ (z<tspan baseline-shift="sub" font-size="19">l</tspan>)</text>

    <!-- input d-vector -->
    <g transform="translate(84 321)">
      <rect x="0" y="0" width="43" height="247" rx="2" fill="var(--viz-series-1)" fill-opacity=".14" class="blue-stroke" stroke-width="2"/>
      <rect x="9" y="11" width="25" height="31" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <rect x="9" y="42" width="25" height="31" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <rect x="9" y="73" width="25" height="31" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <text x="21.5" y="161" class="sans blue-text" font-size="26" text-anchor="middle">⋮</text>
      <rect x="9" y="176" width="25" height="31" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <rect x="9" y="207" width="25" height="31" fill="none" class="blue-stroke" stroke-width="1.5"/>
    </g>
    <text x="106" y="595" class="math" font-size="22" text-anchor="middle">d-dim</text>

    <path d="M 149 450 H 222" class="arrow"/>

    <!-- learned affine projection -->
    <g transform="translate(239 370)">
      <rect width="205" height="167" rx="4" fill="var(--viz-series-2)" fill-opacity=".28" class="teal-stroke" stroke-width="2" stroke-dasharray="9 6"/>
      <g stroke="var(--background)" stroke-width="2" opacity=".92">
        <path d="M12 10H123M12 39H123M12 68H123M12 97H123M12 126H123M12 155H123"/>
        <path d="M12 10V155M39 10V155M68 10V155M96 10V155M123 10V155"/>
        <path d="M166 10H193M166 39H193M166 68H193M166 97H193M166 126H193M166 155H193"/>
        <path d="M166 10V155M193 10V155"/>
      </g>
      <text x="145" y="92" class="sans teal-text" font-size="27" text-anchor="middle">···</text>
    </g>
    <text x="342" y="572" class="math" font-size="24" text-anchor="middle">C × d</text>
    <text x="342" y="629" class="sans teal-text" font-size="23" font-weight="600" text-anchor="middle">down projection</text>

    <path d="M 463 450 H 527" class="arrow"/>

    <!-- z vector -->
    <g transform="translate(548 361)">
      <rect width="42" height="182" rx="2" fill="var(--viz-series-1)" fill-opacity=".14" class="blue-stroke" stroke-width="2"/>
      <rect x="8" y="11" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <rect x="8" y="41" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <text x="21" y="126" class="sans blue-text" font-size="25" text-anchor="middle">⋮</text>
      <rect x="8" y="143" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
    </g>
    <text x="569" y="574" class="sans" font-size="20" text-anchor="middle">C-dim</text>

    <path d="M 606 450 H 665" class="arrow"/>

    <!-- sigmoid -->
    <circle cx="724" cy="450" r="51" fill="var(--viz-series-3)" fill-opacity=".22" class="gold-stroke" stroke-width="1.6"/>
    <text x="724" y="444" class="math" font-size="28" font-weight="600" text-anchor="middle">σ</text>
    <text x="724" y="468" class="sans" font-size="17" text-anchor="middle">(sigmoid)</text>

    <path d="M 781 450 H 840" class="arrow"/>

    <!-- a vector -->
    <g transform="translate(854 361)">
      <rect width="42" height="182" rx="2" fill="var(--viz-series-1)" fill-opacity=".14" class="blue-stroke" stroke-width="2"/>
      <rect x="8" y="11" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <rect x="8" y="41" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <text x="21" y="126" class="sans blue-text" font-size="25" text-anchor="middle">⋮</text>
      <rect x="8" y="143" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
    </g>
    <text x="875" y="574" class="sans" font-size="20" text-anchor="middle">C-dim</text>

    <!-- learned coefficients box -->
    <g transform="translate(36 758)">
      <rect width="186" height="192" rx="17" fill="none" class="teal-stroke" stroke-width="2" stroke-dasharray="9 6"/>
      <text x="94" y="38" class="sans" font-size="23" font-weight="600" text-anchor="middle">learned</text>
      <text x="94" y="68" class="sans" font-size="23" font-weight="600" text-anchor="middle">logits <tspan class="teal-text">coef</tspan></text>
      <line x1="20" y1="140" x2="167" y2="140" stroke="var(--foreground)" stroke-width="1.3"/>
      <rect x="20" y="104" width="13" height="36" fill="var(--viz-series-2)" fill-opacity=".25" class="teal-stroke"/>
      <rect x="43" y="113" width="13" height="27" fill="var(--viz-series-2)" fill-opacity=".25" class="teal-stroke"/>
      <rect x="61" y="140" width="13" height="24" fill="var(--viz-series-2)" fill-opacity=".25" class="teal-stroke"/>
      <text x="99" y="127" class="sans" font-size="24" text-anchor="middle">···</text>
      <rect x="136" y="104" width="13" height="36" fill="var(--viz-series-2)" fill-opacity=".25" class="teal-stroke"/>
      <rect x="156" y="140" width="13" height="24" fill="var(--viz-series-2)" fill-opacity=".25" class="teal-stroke"/>
    </g>
    <text x="129" y="980" class="sans" font-size="20" text-anchor="middle">C-dim</text>

    <path d="M 239 858 H 303" class="arrow"/>

    <!-- softmax turns learned logits into normalized coefficients -->
    <circle cx="367" cy="858" r="51" fill="var(--viz-series-3)" fill-opacity=".22" class="gold-stroke" stroke-width="1.6"/>
    <text x="367" y="865" class="sans" font-size="20" font-weight="600" text-anchor="middle">softmax</text>
    <text x="506" y="741" class="math" font-size="27">p<tspan baseline-shift="sub" font-size="16">l</tspan> = <tspan class="sans" font-size="20" font-style="normal">softmax</tspan>(<tspan class="sans" font-size="20" font-style="normal">coef</tspan>)</text>

    <path d="M 424 858 H 527" class="arrow"/>

    <!-- p vector -->
    <g transform="translate(549 770)">
      <rect width="42" height="182" rx="2" fill="var(--viz-series-1)" fill-opacity=".14" class="blue-stroke" stroke-width="2"/>
      <rect x="8" y="11" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <rect x="8" y="41" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
      <text x="21" y="126" class="sans blue-text" font-size="25" text-anchor="middle">⋮</text>
      <rect x="8" y="143" width="26" height="30" fill="none" class="blue-stroke" stroke-width="1.5"/>
    </g>
    <text x="570" y="982" class="sans" font-size="20" text-anchor="middle">C-dim</text>
    <text x="570" y="1032" class="sans blue-text" font-size="23" font-weight="600" text-anchor="middle">softmax weights p<tspan baseline-shift="sub" font-size="15">l</tspan></text>

    <!-- converging arrows -->
    <path d="M 912 450 H 927 Q 940 450 940 464 V 676" class="arrow"/>
    <path d="M 608 858 H 926 Q 940 858 940 844 V 824" class="arrow"/>

    <!-- elementwise product -->
    <circle cx="940" cy="726" r="31" fill="var(--viz-series-3)" fill-opacity=".14" class="gold-stroke" stroke-width="1.5"/>
    <text x="940" y="736" class="sans" font-size="33" font-style="normal" text-anchor="middle">⊙</text>
    <text x="940" y="786" class="sans" font-size="18" text-anchor="middle">elementwise</text>
    <text x="940" y="811" class="sans" font-size="18" text-anchor="middle">product</text>

    <path d="M 977 726 H 1022" class="arrow"/>

    <!-- product vector -->
    <text x="1056" y="628" class="sans" font-size="27" text-anchor="middle">p<tspan baseline-shift="sub" font-size="16">l</tspan> ⊙ a<tspan baseline-shift="sub" font-size="16">l</tspan></text>
    <g transform="translate(1035 650)">
      <rect width="39" height="175" rx="2" fill="var(--viz-series-1)" fill-opacity=".14" class="blue-stroke" stroke-width="1.7"/>
      <rect x="7" y="10" width="25" height="28" fill="none" class="blue-stroke" stroke-width="1.3"/>
      <rect x="7" y="38" width="25" height="28" fill="none" class="blue-stroke" stroke-width="1.3"/>
      <text x="19.5" y="119" class="sans" font-size="24" text-anchor="middle">⋮</text>
      <rect x="7" y="137" width="25" height="28" fill="none" class="blue-stroke" stroke-width="1.3"/>
    </g>
    <text x="1055" y="854" class="sans" font-size="20" text-anchor="middle">C-dim</text>

    <path d="M 1084 726 H 1117" class="arrow"/>

    <!-- sum -->
    <circle cx="1158" cy="726" r="31" fill="var(--viz-series-3)" fill-opacity=".14" class="gold-stroke" stroke-width="1.5"/>
    <text x="1158" y="738" class="math" font-size="34" text-anchor="middle">Σ<tspan baseline-shift="sub" font-size="16">i</tspan></text>
    <text x="1158" y="796" class="sans" font-size="18" text-anchor="middle">sum</text>

    <path d="M 1195 726 H 1235" class="arrow"/>

    <!-- beta operation -->
    <text x="1278" y="607" class="math teal-text" font-size="22" text-anchor="middle">β<tspan baseline-shift="sub" font-size="13">l</tspan> &gt; 0</text>
    <rect x="1263" y="617" width="30" height="32" rx="2" fill="var(--viz-series-2)" fill-opacity=".22" class="teal-stroke" stroke-width="1.6" stroke-dasharray="7 4"/>
    <path d="M 1278 654 V 682" class="arrow"/>
    <circle cx="1278" cy="726" r="37" fill="var(--viz-series-3)" fill-opacity=".22" class="gold-stroke" stroke-width="1.5"/>
    <text x="1278" y="736" class="math" font-size="31" text-anchor="middle">(·)<tspan baseline-shift="super" font-size="18">β<tspan baseline-shift="sub" font-size="12">l</tspan></tspan></text>
    <text x="1278" y="797" class="sans" font-size="17" text-anchor="middle">raise to β<tspan baseline-shift="sub" font-size="12">l</tspan></text>

    <path d="M 1320 726 H 1356" class="arrow"/>

    <!-- output -->
    <text x="1383" y="661" class="math" font-size="21" text-anchor="middle">m<tspan baseline-shift="sub" font-size="13">l</tspan>(R̄<tspan baseline-shift="sub" font-size="13">l</tspan>)</text>
    <rect x="1368" y="710" width="31" height="36" fill="var(--viz-series-4)" fill-opacity=".18" class="purple-stroke" stroke-width="1.6"/>
    <text x="1384" y="796" class="sans" font-size="17" text-anchor="middle">scalar</text>
    <text x="1384" y="820" class="sans" font-size="17" text-anchor="middle">modulator</text>
    <text x="1384" y="867" class="sans purple-text" font-size="20" font-style="italic" font-weight="600" text-anchor="middle">single</text>
    <text x="1384" y="891" class="sans purple-text" font-size="20" font-style="italic" font-weight="600" text-anchor="middle">scalar gate</text>
  </svg>
