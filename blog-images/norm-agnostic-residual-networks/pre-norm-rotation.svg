<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Same layer output, different residual norm</title>
  <desc id="desc">Two vector diagrams compare the same orthogonal layer update applied to a large and small residual. The smaller residual rotates by 26.6 degrees, versus 14 degrees for the larger residual.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .grid { stroke: #e9ebee; stroke-width: 1; opacity: .72; }
      .axis { stroke: #aeb4bc; stroke-width: 1.25; }
      .title { fill: #1f2430; font-size: 28px; font-weight: 500; }
      .panel-title { fill: #1f2430; font-size: 21px; font-weight: 500; }
      .label { fill: #1f2430; font-size: 16px; font-weight: 500; }
      .note { fill: #5f6673; font-size: 15px; font-weight: 400; }
      .residual { stroke: #2457d6; fill: none; }
      .updated { stroke: #008778; fill: none; }
      .delta { stroke: #d44f35; fill: none; }
      .angle { stroke: #70757f; fill: none; }
    </style>
    <marker id="arrow-residual" markerWidth="7" markerHeight="7" refX="6.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0v5l7-2.5z" fill="#2457d6"/></marker>
    <marker id="arrow-updated" markerWidth="7" markerHeight="7" refX="6.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0v5l7-2.5z" fill="#008778"/></marker>
    <marker id="arrow-delta" markerWidth="7" markerHeight="7" refX="6.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0v5l7-2.5z" fill="#d44f35"/></marker>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" class="grid" fill="none"/></pattern>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>
  <text x="560" y="43" text-anchor="middle" class="title">Same layer output, different residual norm</text>

  <text x="290" y="113" text-anchor="middle" class="panel-title">Large residual norm</text>
  <text x="830" y="113" text-anchor="middle" class="panel-title">Small residual norm</text>

  <g transform="translate(187 128)">
    <circle cx="17" cy="16" r="5" fill="#2457d6"/>
    <text x="31" y="21" class="note">residual [12, 4]</text>
  </g>
  <g transform="translate(727 128)">
    <circle cx="17" cy="16" r="5" fill="#2457d6"/>
    <text x="31" y="21" class="note">residual [6, 2]</text>
  </g>

  <rect x="70" y="176" width="440" height="286" fill="url(#grid)"/>
  <rect x="610" y="176" width="440" height="286" fill="url(#grid)"/>
  <line x1="70" y1="350" x2="510" y2="350" class="axis"/>
  <line x1="280" y1="176" x2="280" y2="462" class="axis"/>
  <line x1="610" y1="350" x2="1050" y2="350" class="axis"/>
  <line x1="820" y1="176" x2="820" y2="462" class="axis"/>

  <path d="M280 350L460 290" class="residual" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-residual)"/>
  <path d="M280 350L445 245" class="updated" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-updated)"/>
  <path d="M460 290L445 245" class="delta" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-delta)"/>
  <path d="M332.2 332.6A55 55 0 0 0 326.4 320.5" class="angle" stroke-width="2.5" stroke-linecap="round"/>
  <text x="305" y="290" class="label">14.0°</text>
  <text x="455" y="321" text-anchor="end" class="note">[12, 4]</text>
  <text x="433" y="216" text-anchor="end" class="note">[11, 7]</text>

  <path d="M820 350L910 320" class="residual" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-residual)"/>
  <path d="M820 350L895 275" class="updated" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-updated)"/>
  <path d="M910 320L895 275" class="delta" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-delta)"/>
  <path d="M872.2 332.6A55 55 0 0 0 858.9 311.1" class="angle" stroke-width="2.5" stroke-linecap="round"/>
  <text x="835" y="278" class="label">26.6°</text>
  <text x="904" y="346" text-anchor="end" class="note">[6, 2]</text>
  <text x="883" y="246" text-anchor="end" class="note">[5, 5]</text>

  <g transform="translate(357 516)">
    <line x1="0" y1="0" x2="28" y2="0" class="updated" stroke-width="4" stroke-linecap="round"/>
    <text x="39" y="5" class="note">residual + update</text>
    <line x1="210" y1="0" x2="238" y2="0" class="delta" stroke-width="4" stroke-linecap="round"/>
    <text x="249" y="5" class="note">same layer output Δ = [-1, 3]</text>
  </g>
</svg>
